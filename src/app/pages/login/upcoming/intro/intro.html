<p class="eyebrow">
    <span style="color: var(--color-red);">$ </span>
    <span style="color: var(--color-gold);">./sukuna --status </span>
    <span style="color: var(--color-muted);">// launching September 1, 2026</span>
</p>

<h1><span class="typed" [class.blink]="typingDone()">{{ headline() }}</span></h1>

<p class="subtitle">近日公開</p>

<p class="description">A considered edit of electronics, jewelry and clothing is on its way. Nothing extra — only pieces worth keeping.</p>

<div class="countdown">
  <div class="countdown-item">
    <p class="countdown-number">{{ days() }}</p>
    <p class="countdown-label">DAYS</p>
  </div>
  <div class="countdown-item">
    <p class="countdown-number">{{ hours() }}</p>
    <p class="countdown-label">HOURS</p>
  </div>
  <div class="countdown-item">
    <p class="countdown-number">{{ minutes() }}</p>
    <p class="countdown-label">MINUTES</p>
  </div>
  <div class="countdown-item">
    <p class="countdown-number">{{ seconds() }}</p>
    <p class="countdown-label">SECONDS</p>
  </div>
</div>

<button type="button" class="apply-button" (click)="onApply()">[APPLY]</button>
